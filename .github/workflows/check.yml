name: Check shared release workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/*.test.mjs
  dry-run:
    needs: test
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      dry-run: true
      package-path: tests/fixture
      install-command: ''
      prepare-command: npm pack --dry-run
